name: Research artifact checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q scripts tests
      - name: Validate recorded metrics and notebooks
        run: python -m unittest discover -s tests -v
      - name: CLI help smoke test
        run: python scripts/predict.py --help
